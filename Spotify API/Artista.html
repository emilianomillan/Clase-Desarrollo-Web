<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spotify Artists Info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="artist-profile.js" defer></script>
  </head>
  <body class="bg-dark text-white">
    <div class="container-fluid bg-black py-4">
      <div class="container">
        <h1 class="display-5 fw-bold text-success mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-spotify mb-2" viewBox="0 0 16 16">
            <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.669 11.538a.5.5 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686m.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858m.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 1 1-.764 1.288"/>
          </svg>
          Spotify Artists Info
        </h1>
        
        <div class="row g-3 mb-4">
          <div class="col-12">
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-dark text-white border-secondary">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-key-fill" viewBox="0 0 16 16">
                  <path d="M3.5 11.5a3.5 3.5 0 1 1 3.163-5H14L15.5 8 14 9.5l-1-1-1 1-1-1-1 1zm-.657.657a4.5 4.5 0 1 1 6.364-6.364L10 7.5 8.5 9l1 1L8 11.5l1 1-1.793 1.793a4.5 4.5 0 0 1-5.364-1.636z"/>
                </svg>
              </span>
              <input
                class="form-control bg-dark text-white border-secondary"
                type="text"
                id="token"
                placeholder="Bearer token here"
              />
            </div>
          </div>
          
          <div class="col-md-8 col-lg-9">
            <select class="form-select form-select-lg bg-dark text-white border-secondary" id="artist-id">
              <option value="0TnOYISbd1XYRBk9myaseg">Pitbull</option>
              <option value="4q3ewBCX7sLwd24euuV69X">Bad Bunny</option>
              <option value="1McMsnEElThX1knmY4oliG">Nicolás Jaar</option>
              <option value="1Xyo4u8uXC1ZmMpatF05PJ">The Weeknd</option>
              <option value="3TVXtAsR1Inumwj472S9r4">Drake</option>
              <option value="06HL4z0CvFAxyc27GXpf02">Taylor Swift</option>
            </select>
          </div>
          
          <div class="col-md-4 col-lg-3">
            <button 
                    onclick="obtenArtistaFijo()"
                    class="btn btn-success btn-lg w-100 fw-bold" 
            >Obtener artista</button>
          </div>
        </div>
      </div>
    </div>

    <div class="container py-5">
      <section id="artist-info"></section>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz4YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
